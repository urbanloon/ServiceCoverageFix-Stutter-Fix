name: Compatibility guard tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validator-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        framework: [net8.0, net48]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run production-validator fixtures (not the game mod)
        run: dotnet run --project tests/compatibility/CompatibilityTests.csproj --configuration Release --framework ${{ matrix.framework }}
  existing-coverage-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unchanged byte-radix reference model
        run: python tests/reference_model.py
